
  # === SCRIPT CHECKS ===
  # The repository tooling: file size, required docs, Python lint, the script
  # tests and the JavaScript-first rule itself.
  scripts:
    name: Script Checks
    concurrency:
      group: js-${{ github.workflow }}-${{ github.ref }}-scripts
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Check that Rust runs only behind the JavaScript stage
        run: node scripts/check-javascript-first.mjs

      - name: Check file size limit
        run: node scripts/check-file-size.mjs

      - name: Check required documentation
        run: node scripts/check-required-docs.mjs

      # The Python scripts the currency workflow runs (ruff.toml pins the rules).
      - name: Lint Python scripts
        run: |
          pipx run ruff==0.17.0 check .
          pipx run ruff==0.17.0 format --check .

      - name: Run script tests
        run: node --test scripts/*.test.mjs

  # === JAVASCRIPT ENGINE ===
  # The native engine in js/ (issue #254) on the oldest supported Node.js,
  # the current one, and Bun.
  js-lint:
    name: JS Lint and Type Check
    concurrency:
      group: js-${{ github.workflow }}-${{ github.ref }}-js-lint
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: js/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check the generated data modules
        run: node scripts/generate-data.mjs --check

  js-test:
    name: JS Test (${{ matrix.runtime }})
    concurrency:
      group: js-${{ github.workflow }}-${{ github.ref }}-js-test-${{ matrix.runtime }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [node-20, node-24, bun]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.runtime == 'node-20' && '20.x' || '24.x' }}
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: npm ci

      - name: Run tests
        if: matrix.runtime != 'bun'
        run: npm test

      - name: Run tests on Bun
        if: matrix.runtime == 'bun'
        run: bun --bun x vitest run
