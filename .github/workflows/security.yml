name: Security

# Supply-chain and static analysis checks (issue #256). Adapted from
# link-foundation/rust-ai-driven-development-pipeline-template and the
# js template's npm audit job.
on:
  push:
    branches: [main]
  pull_request:
  # Advisories are published against code that did not change, so audit
  # weekly as well.
  schedule:
    - cron: '0 6 * * 1'

# Keep the workflow read-only unless a job explicitly needs an additional scope.
permissions:
  contents: read

# Provide Git config to actions/checkout itself; checkout runs git init before
# any workflow step can configure Git.
env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  npm-audit:
    name: npm audit (${{ matrix.package }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-npm-audit-${{ matrix.package }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        package: [js, web]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Audit committed package-lock.json
        working-directory: ${{ matrix.package }}
        run: npm audit --package-lock-only --audit-level=high

  codeql:
    name: CodeQL (${{ matrix.language }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-codeql-${{ matrix.language }}
      cancel-in-progress: true
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        # rust runs in rust.yml, behind the JavaScript stage (issue #254).
        language: [actions, javascript-typescript, python]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/analyze@v4

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    concurrency:
      group: check-${{ github.workflow }}-${{ github.ref }}-dependency-review
      cancel-in-progress: true
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # The action fails with "Dependency review is not supported on this
      # repository" while the repository's Dependency graph setting is off
      # (run 38166546592). That is a setting, not a defect in the PR, and
      # cargo audit (rust.yml) and npm audit above still gate known vulnerabilities, so
      # warn until it is enabled. The SBOM endpoint answers 404 exactly then;
      # any other unexpected status fails closed.
      - name: Check that the dependency graph is enabled
        id: graph
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/dependency-graph/sbom")
          echo "dependency-graph/sbom answered HTTP $status"
          case "$status" in
            200) echo 'enabled=true' >> "$GITHUB_OUTPUT" ;;
            404)
              echo 'enabled=false' >> "$GITHUB_OUTPUT"
              echo "::warning title=Dependency review skipped::Enable the Dependency graph at $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/settings/security_analysis to review dependency changes."
              ;;
            *) echo "::error title=Dependency graph probe::Unexpected HTTP $status"; exit 1 ;;
          esac

      - if: steps.graph.outputs.enabled == 'true'
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  # Terminal status gate: a job killed by timeout-minutes reports cancelled,
  # which the gate turns into a visible failure.
  pipeline-status:
    name: Pipeline Status
    needs:
      - npm-audit
      - codeql
      - dependency-review
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check aggregate pipeline status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # On pull_request, github.sha is the synthetic merge commit and ref_name
          # is <n>/merge, neither of which a superseding push moves; compare
          # the PR head instead so superseded PR runs are recognised.
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_REF: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/check-pipeline-status.sh
