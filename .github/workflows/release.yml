name: CI/CD Pipeline

on:
  push:
    branches:
      - main
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - 'scripts/**'
      - 'web/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docs/case-studies/issue-227/corpus/**'
      - 'docs/case-studies/issue-227/results/coverage-baseline.json'
      - '.github/workflows/**'
      - '.github/actions/**'
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'data/**'
      - 'scripts/**'
      - 'web/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - 'docs/case-studies/issue-227/corpus/**'
      - 'docs/case-studies/issue-227/results/coverage-baseline.json'
      - '.github/workflows/**'
      - '.github/actions/**'
  workflow_dispatch:
    inputs:
      release_mode:
        # `checks` runs the CI jobs without releasing. A bot PR opened with
        # GITHUB_TOKEN gets a pull_request run only after a maintainer approves
        # it, so its workflow dispatches this mode on the PR branch (issue #256).
        description: 'Manual release mode'
        required: true
        type: choice
        default: 'instant'
        options:
          - instant
          - changelog-pr
          - checks
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
      description:
        description: 'Release description (optional)'
        required: false
        type: string

# Least-privilege default for every job; jobs that need more escalate
# explicitly (issue #256).
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'
  # The crates.io credentials are deliberately *not* declared here (issue
  # #256). A workflow-level `env:` is inherited by every job, including the
  # pull_request jobs that compile and run branch code (build.rs, tests, npm
  # install scripts), so they are declared only on the publish steps and
  # the publish-token preflight steps instead.

jobs:
  # === DETECT CHANGES - determines which jobs should run ===
  detect-changes:
    name: Detect Changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name != 'workflow_dispatch'
    outputs:
      rs-changed: ${{ steps.changes.outputs.rs-changed }}
      toml-changed: ${{ steps.changes.outputs.toml-changed }}
      mjs-changed: ${{ steps.changes.outputs.mjs-changed }}
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
      workflow-changed: ${{ steps.changes.outputs.workflow-changed }}
      any-code-changed: ${{ steps.changes.outputs.any-code-changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Detect changes
        id: changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/detect-code-changes.mjs

  # === CHANGELOG CHECK - only runs on PRs with code changes ===
  # Docs-only PRs (./docs folder, markdown files) don't require changelog fragments
  changelog:
    name: Changelog Fragment Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.any-code-changed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Check for changelog fragments
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-changelog-fragment.mjs

  # === VERSION CHECK - prevents manual version modification in PRs ===
  # This ensures versions are only modified by the automated release pipeline
  version-check:
    name: Version Modification Check
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Check for manual version changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-version-modification.mjs

  # === SECRETS SCAN ===
  # Language-agnostic credential scan (issue #256, from the Rust pipeline
  # template); runs via npx so no Node dependency is committed.
  secrets-scan:
    name: Secrets Scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Run secretlint
        run: npx --yes -p secretlint@13.0.7 -p @secretlint/secretlint-rule-preset-recommend@13.0.7 secretlint --secretlintignore .gitignore "**/*"

  # === FRESH MERGE SIMULATION ===
  # Catches semantic merge conflicts: a pull request that is green in isolation
  # but breaks main once merged into its current tip (issue #256, from the Rust
  # pipeline template). FRESH_MERGE_VERBOSE=1 traces the script.
  fresh-merge:
    name: Fresh Merge Simulation
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.any-code-changed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master branch @ 2026-10-09
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-fresh-merge-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-fresh-merge-

      - name: Simulate fresh merge with base branch
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: bash scripts/simulate-fresh-merge.sh

  # === LINT AND FORMAT CHECK ===
  # Lint runs independently of changelog check - it's a fast check that should always run
  # See: https://github.com/link-assistant/hive-mind/pull/1024 for why this dependency was removed
  lint:
    name: Lint and Format Check
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [detect-changes]
    # Note: a status function is required because detect-changes is skipped on
    # workflow_dispatch, and without one this job would also be skipped even
    # though its condition includes workflow_dispatch. `!cancelled()` (unlike
    # `always()`) still lets a cancelled run stop here (issue #256).
    # See: https://github.com/actions/runner/issues/491
    if: |
      !cancelled() && (
        github.event_name == 'push' ||
        github.event_name == 'workflow_dispatch' ||
        needs.detect-changes.outputs.any-code-changed == 'true' ||
        needs.detect-changes.outputs.rs-changed == 'true' ||
        needs.detect-changes.outputs.toml-changed == 'true' ||
        needs.detect-changes.outputs.mjs-changed == 'true' ||
        needs.detect-changes.outputs.docs-changed == 'true' ||
        needs.detect-changes.outputs.workflow-changed == 'true'
      )
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master branch @ 2026-10-09
        with:
          toolchain: stable
          components: rustfmt, clippy

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        # --workspace keeps the experiments member compiling (issue #256).
        run: cargo clippy --workspace --all-targets --all-features

      - name: Check file size limit
        run: node scripts/check-file-size.mjs

      - name: Check required documentation
        run: node scripts/check-required-docs.mjs

      # The Python scripts the currency workflow runs (ruff.toml pins the rules).
      - name: Lint Python scripts
        run: |
          pipx run ruff==0.17.0 check .
          pipx run ruff==0.17.0 format --check .

      - name: Run script tests
        run: node --test scripts/*.test.mjs

  # === DEPENDENCY FRESHNESS ===
  # Fails when a direct dependency is behind its latest release, unless its
  # manifest documents the blocker with an issue URL (issue #223). Upstream
  # releases, not this repository's diff, make dependencies stale, so the job
  # runs on every pipeline run.
  dependency-freshness:
    name: Dependency Freshness
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master branch @ 2026-10-09
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Cache cargo-outdated
        id: cargo-outdated-cache
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/cargo-outdated
          key: ${{ runner.os }}-cargo-outdated-0.19

      - name: Install cargo-outdated
        if: steps.cargo-outdated-cache.outputs.cache-hit != 'true'
        run: cargo install cargo-outdated --locked --version '^0.19'

      - name: Install web dependencies
        working-directory: web
        run: npm ci

      # Issue #256: freshness is external state, so it blocks pull requests
      # only; on push to main (or schedule/dispatch) it emits warnings instead
      # of failing a pipeline whose code already passed the gate.
      - name: Check dependency freshness
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/check-dependency-freshness.mjs

  # === TEST ===
  # Test runs independently of changelog check
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    needs: [detect-changes, changelog]
    # Run if: push event, OR changelog succeeded, OR changelog was skipped (docs-only PR)
    if: ${{ !cancelled() && (github.event_name == 'push' || github.event_name == 'workflow_dispatch' || needs.changelog.result == 'success' || needs.changelog.result == 'skipped') }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master branch @ 2026-10-09
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run tests
        run: cargo test --all-features --verbose

      - name: Run doc tests
        run: cargo test --doc --verbose

  # === COMPETITOR COVERAGE ===
  coverage:
    name: Competitor Coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    needs: [test]
    # Changelog/detection ancestors may be skipped on corpus-only or manual runs.
    if: ${{ !cancelled() && needs.test.result == 'success' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master branch @ 2026-10-09
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build release binary
        run: cargo build --release --locked --bin link-calculator

      - name: Check competitor coverage
        id: competitor-check
        run: |
          rm -f docs/case-studies/issue-227/results/coverage-report.md
          node scripts/competitor-coverage.mjs --binary experiments/issue-227/bounded-calculator.sh --baseline docs/case-studies/issue-227/results/coverage-baseline.json --quiet

      - name: Upload coverage report
        if: ${{ !cancelled() && steps.competitor-check.outcome != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: competitor-coverage-report
          path: docs/case-studies/issue-227/results/coverage-report.md
          retention-days: 14

  # === BUILD ===
  # Build package - only runs if lint, tests and competitor coverage pass
  build:
    name: Build Package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint, test, coverage]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.test.result == 'success' && needs.coverage.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master branch @ 2026-10-09
        with:
          toolchain: stable

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build release
        run: cargo build --release --verbose

      - name: Check package
        run: cargo package --list --allow-dirty

      # crates.io rejects uploads over 10 MiB with "413 Payload Too Large",
      # which silently blocked the v0.20.4..v0.21.0 releases (issue #223).
      - name: Check package size
        run: |
          cargo package --allow-dirty --no-verify
          size=$(stat -c %s target/package/*.crate)
          echo "Package size: $size bytes"
          if [ "$size" -ge 10485760 ]; then
            echo "::error::The .crate file is $size bytes; crates.io accepts at most 10 MiB. Narrow the include list in Cargo.toml."
            exit 1
          fi

  # === WASM BUILD ===
  # Build WASM package for web deployment
  wasm-build:
    name: WASM Build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    needs: [lint, test, coverage]
    if: ${{ !cancelled() && needs.lint.result == 'success' && needs.test.result == 'success' && needs.coverage.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master branch @ 2026-10-09
        with:
          toolchain: stable

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Build WASM
        run: wasm-pack build --target web

  # === WEB BUILD ===
  # Build web application with WASM package
  web-build:
    name: Web Build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    needs: [wasm-build]
    if: ${{ !cancelled() && needs.wasm-build.result == 'success' }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master branch @ 2026-10-09
        with:
          toolchain: stable

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Build WASM package
        run: wasm-pack build --target web --out-dir web/public/pkg

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Copy currency data files to web public directory
        run: |
          mkdir -p web/public/data/currency
          cp data/currency/*.lino web/public/data/currency/
          count=$(find data/currency -maxdepth 1 -name '*.lino' | wc -l)
          echo "Copied $count .lino files to web/public/data/currency/"

      # Issue #256: `npm run lint` called an eslint that was never installed
      # (typescript-eslint does not support TypeScript 7), so the web code was
      # never linted. oxlint parses TypeScript natively.
      - name: Lint
        working-directory: web
        run: npm run lint

      - name: Type check
        working-directory: web
        run: npx tsc --noEmit

      - name: Run web tests
        working-directory: web
        run: npm test

      - name: Build
        working-directory: web
        run: npm run build

      # Issue #256: the Playwright suite in web/e2e was never run by CI, so 8 of
      # its 50 tests had silently rotted (false negative). Run it on the build.
      - name: Install Playwright browsers
        working-directory: web
        run: npx playwright install chromium --with-deps

      - name: Run end-to-end tests
        working-directory: web
        run: npx playwright test

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ github.run_id }}
          path: web/playwright-report
          retention-days: 7

      - name: Upload web build artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  # === DEPLOY TO GITHUB PAGES ===
  # Deploy web application to GitHub Pages (only on push to main)
  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: [web-build]
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.web-build.result == 'success'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download web build artifact
        uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # === AUTO RELEASE ===
  # Automatic release on push to main using changelog fragments
  # This job automatically bumps version based on fragments in changelog.d/
  auto-release:
    name: Auto Release
    needs: [lint, test, build]
    # Note: `!cancelled()` keeps this job evaluable when an ancestor was skipped.
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: main-writer-main
      cancel-in-progress: false
    permissions:
      contents: write
    outputs:
      version_committed: ${{ steps.version.outputs.version_committed }}
      new_version: ${{ steps.version.outputs.new_version }}
    steps:
      - uses: actions/checkout@v7
        with:
          # This job pushes with the checkout credentials, so it keeps them.
          persist-credentials: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master branch @ 2026-10-09
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Configure git
        run: node scripts/git-config.mjs

      - name: Determine bump type from changelog fragments
        id: bump_type
        run: node scripts/get-bump-type.mjs

      - name: Check if version already released or no fragments
        id: check
        env:
          HAS_FRAGMENTS: ${{ steps.bump_type.outputs.has_fragments }}
        run: node scripts/check-release-needed.mjs

      # Principle 16: the bump below is pushed to main before cargo publish
      # runs, so prove the token can publish first (issue #223 left main
      # bumped and tagged on versions crates.io never received).
      - name: Preflight crates.io publish token
        if: steps.check.outputs.should_release == 'true'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN || secrets.CARGO_REGISTRY_TOKEN }}
        run: node scripts/preflight-crates-token.mjs

      - name: Collect changelog and bump version
        id: version
        if: steps.check.outputs.should_release == 'true' && steps.check.outputs.skip_bump != 'true'
        env:
          BUMP_TYPE: ${{ steps.bump_type.outputs.bump_type }}
        run: node scripts/version-and-commit.mjs --bump-type "$BUMP_TYPE"

      - name: Get current version
        id: current_version
        if: steps.check.outputs.should_release == 'true'
        run: node scripts/get-version.mjs

      - name: Build release
        if: steps.check.outputs.should_release == 'true'
        run: cargo build --release

      - name: Publish to Crates.io
        if: steps.check.outputs.should_release == 'true'
        id: publish-crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN || secrets.CARGO_REGISTRY_TOKEN }}
        run: node scripts/publish-crate.mjs

      - name: Create GitHub Release
        if: steps.check.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.current_version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/create-github-release.mjs --release-version "$RELEASE_VERSION" --repository "$REPOSITORY"

  # === DEPLOY WEB AFTER RELEASE ===
  # Rebuild and redeploy the web app AFTER the auto-release job bumps the version.
  # The standard wasm-build/web-build/deploy-pages jobs run in parallel with auto-release
  # and therefore use the OLD Cargo.toml version. This job runs sequentially after
  # auto-release to ensure the web footer shows the correct version.
  # See: https://github.com/link-assistant/calculator/issues/78
  deploy-after-release:
    name: Deploy Web After Release
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    needs: [auto-release, deploy-pages]
    # Only run when auto-release actually committed a new version bump.
    # This ensures the web app is rebuilt and redeployed with the updated version
    # in the footer (CARGO_PKG_VERSION is embedded at WASM compile time).
    # We also wait for deploy-pages to finish first to avoid concurrent deployments
    # to the same GitHub Pages environment.
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.auto-release.result == 'success' &&
      needs.auto-release.outputs.version_committed == 'true'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          # Checkout the latest commit on main, which includes the version bump
          # pushed by the auto-release job
          ref: main

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master branch @ 2026-10-09
        with:
          toolchain: stable

      - name: Install wasm-pack
        uses: ./.github/actions/install-wasm-pack

      - name: Build WASM package with updated version
        run: wasm-pack build --target web --out-dir web/public/pkg

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        working-directory: web
        run: npm ci

      - name: Copy currency data files to web public directory
        run: |
          mkdir -p web/public/data/currency
          cp data/currency/*.lino web/public/data/currency/
          count=$(find data/currency -maxdepth 1 -name '*.lino' | wc -l)
          echo "Copied $count .lino files to web/public/data/currency/"

      - name: Build web app
        working-directory: web
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web/dist
          # Use a unique name to avoid 409 Conflict with the artifact uploaded by
          # the earlier deploy-pages job within the same workflow run.
          # Both upload-pages-artifact and deploy-pages support custom artifact names.
          name: github-pages-after-release

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-after-release

  # === UPDATE SCREENSHOTS AFTER RELEASE ===
  # After a new version is released and deployed, regenerate all documentation
  # screenshots so they reflect the latest version of the app.
  update-screenshots-after-release:
    name: Update Screenshots After Release
    needs: [auto-release, deploy-after-release]
    # Only run when auto-release actually committed a new version bump and
    # the updated web app has been deployed to GitHub Pages.
    if: |
      !cancelled() &&
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main' &&
      needs.auto-release.result == 'success' &&
      needs.auto-release.outputs.version_committed == 'true' &&
      needs.deploy-after-release.result == 'success'
    uses: ./.github/workflows/update-screenshots.yml
    permissions:
      contents: write

  # === MANUAL INSTANT RELEASE ===
  # Manual release via workflow_dispatch - only after CI passes
  manual-release:
    name: Instant Release
    needs: [lint, test, build]
    # Note: `!cancelled()` is required to evaluate the condition when an ancestor was skipped.
    # The build job ensures lint and test passed before this job runs.
    if: |
      !cancelled() &&
      github.event_name == 'workflow_dispatch' &&
      github.event.inputs.release_mode == 'instant' &&
      needs.build.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: main-writer-main
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          # This job pushes with the checkout credentials, so it keeps them.
          persist-credentials: true
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master branch @ 2026-10-09
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Configure git
        run: node scripts/git-config.mjs

      # Principle 16: the bump below is pushed to main before cargo publish
      # runs, so prove the token can publish first (issue #223 left main
      # bumped and tagged on versions crates.io never received).
      - name: Preflight crates.io publish token
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN || secrets.CARGO_REGISTRY_TOKEN }}
        run: node scripts/preflight-crates-token.mjs

      - name: Collect changelog fragments
        run: node scripts/collect-changelog.mjs

      - name: Version and commit
        id: version
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: node scripts/version-and-commit.mjs --bump-type "$BUMP_TYPE" --description "$DESCRIPTION"

      - name: Build release
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        run: cargo build --release

      - name: Publish to Crates.io
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        id: publish-crate
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN || secrets.CARGO_TOKEN }}
          CARGO_TOKEN: ${{ secrets.CARGO_TOKEN || secrets.CARGO_REGISTRY_TOKEN }}
        run: node scripts/publish-crate.mjs

      - name: Create GitHub Release
        if: steps.version.outputs.version_committed == 'true' || steps.version.outputs.already_released == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_VERSION: ${{ steps.version.outputs.new_version }}
          REPOSITORY: ${{ github.repository }}
        run: node scripts/create-github-release.mjs --release-version "$RELEASE_VERSION" --repository "$REPOSITORY"

  # === MANUAL CHANGELOG PR ===
  changelog-pr:
    name: Create Changelog PR
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'changelog-pr'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # actions: write dispatches the CI checks for the release PR.
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # create-pull-request authenticates with its own `token` input
          # (git-config-helper.ts configureToken), so no credential persists.
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Create changelog fragment
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: node scripts/create-changelog-fragment.mjs --bump-type "$BUMP_TYPE" --description "$DESCRIPTION"

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: add changelog for manual ${{ github.event.inputs.bump_type }} release'
          branch: changelog-manual-release-${{ github.run_id }}
          delete-branch: true
          title: 'chore: manual ${{ github.event.inputs.bump_type }} release'
          body: |
            ## Manual Release Request

            This PR was created by a manual workflow trigger to prepare a **${{ github.event.inputs.bump_type }}** release.

            ### Release Details
            - **Type:** ${{ github.event.inputs.bump_type }}
            - **Description:** ${{ github.event.inputs.description || 'Manual release' }}
            - **Triggered by:** @${{ github.actor }}

            ### Next Steps
            1. Review the changelog fragment in this PR
            2. Merge this PR to main
            3. The automated release workflow will publish to crates.io and create a GitHub release

      # A PR opened with GITHUB_TOKEN gets pull_request runs that wait for a
      # maintainer to approve them, and a merge without approval concludes the
      # zero-job run as failed (PR #255, issue #256). workflow_dispatch runs
      # start right away, and their check runs attach to the PR head commit.
      - name: Run CI checks on the release PR
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          echo "$PR_URL was opened with GITHUB_TOKEN, so its pull_request run waits for approval; dispatching the CI checks on $PR_BRANCH."
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$PR_BRANCH" -f release_mode=checks
          echo "Dispatched: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/release.yml?query=branch%3A$PR_BRANCH"

  # === PIPELINE STATUS ===
  # Terminal status gate (issue #256, from the Rust pipeline template). Jobs
  # skipped by a failed ancestor, or killed by timeout-minutes (reported as
  # "cancelled"), otherwise leave a run that looks finished without a red
  # mark. Observing every job here makes one required check that fails closed.
  pipeline-status:
    name: Pipeline Status
    needs:
      - detect-changes
      - changelog
      - version-check
      - secrets-scan
      - fresh-merge
      - lint
      - dependency-freshness
      - test
      - coverage
      - build
      - wasm-build
      - web-build
      - deploy-pages
      - auto-release
      - deploy-after-release
      - update-screenshots-after-release
      - manual-release
      - changelog-pr
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check aggregate pipeline status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # Used to tell a cancelled-but-superseded run (expected churn) from a
          # cancelled run that was still the branch head (a hidden timeout).
          # On pull_request, github.sha is the synthetic merge commit and ref_name
          # is <n>/merge, neither of which a superseding push moves; compare
          # the PR head instead so superseded PR runs are recognised.
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_REF: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/check-pipeline-status.sh
