name: CI/CD Pipeline

# JavaScript first (issue #254): every job in this file is JavaScript, Python
# or shell. The Rust jobs live in rust.yml, which rust-stage calls only after
# every JavaScript job passed, so a broken JavaScript check never spends Rust
# build minutes. scripts/check-javascript-first.mjs enforces the split. There
# are no path filters: the parity and translation checks run on every change.

on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
  # Weekly: dependency freshness, advisories and the coverage gap report
  # depend on upstream state, not on this repository's diff.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:
    inputs:
      release_mode:
        # `checks` runs the CI jobs without releasing. A bot PR opened with
        # GITHUB_TOKEN gets a pull_request run only after a maintainer approves
        # it, so its workflow dispatches this mode on the PR branch (issue #256).
        # `screenshots` and `coverage-gap-report` run those jobs of rust.yml,
        # which replaced the separate workflow triggers (issue #254).
        description: 'Manual release mode'
        required: true
        type: choice
        default: 'instant'
        options:
          - instant
          - changelog-pr
          - checks
          - screenshots
          - coverage-gap-report
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        default: 'patch'
        options:
          - patch
          - minor
          - major
      description:
        description: 'Release description (optional)'
        required: false
        type: string

# Least-privilege default for every job; jobs that need more escalate
# explicitly (issue #256).
permissions:
  contents: read

# No workflow-level concurrency (issue #254): every JavaScript job cancels
# its superseded run through its own group, while rust-stage queues per branch
# and never cancels, so a push does not kill a Rust build halfway.

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

jobs:
  # === DETECT CHANGES - determines which jobs should run ===
  detect-changes:
    name: Detect Changes
    concurrency:
      group: js-${{ github.workflow }}-${{ github.ref }}-detect-changes
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    outputs:
      rs-changed: ${{ steps.changes.outputs.rs-changed }}
      toml-changed: ${{ steps.changes.outputs.toml-changed }}
      mjs-changed: ${{ steps.changes.outputs.mjs-changed }}
      docs-changed: ${{ steps.changes.outputs.docs-changed }}
      workflow-changed: ${{ steps.changes.outputs.workflow-changed }}
      any-code-changed: ${{ steps.changes.outputs.any-code-changed }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Detect changes
        id: changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node scripts/detect-code-changes.mjs

  # === CHANGELOG CHECK - only runs on PRs with code changes ===
  # Docs-only PRs (./docs folder, markdown files) don't require changelog fragments
  changelog:
    name: Changelog Fragment Check
    concurrency:
      group: js-${{ github.workflow }}-${{ github.ref }}-changelog
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    needs: [detect-changes]
    if: github.event_name == 'pull_request' && needs.detect-changes.outputs.any-code-changed == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Check for changelog fragments
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-changelog-fragment.mjs

  # === VERSION CHECK - prevents manual version modification in PRs ===
  # This ensures versions are only modified by the automated release pipeline
  version-check:
    name: Version Modification Check
    concurrency:
      group: js-${{ github.workflow }}-${{ github.ref }}-version-check
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Check for manual version changes
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-version-modification.mjs

  # === SECRETS SCAN ===
  # Language-agnostic credential scan (issue #256, from the Rust pipeline
  # template); runs via npx so no Node dependency is committed.
  secrets-scan:
    name: Secrets Scan
    concurrency:
      group: js-${{ github.workflow }}-${{ github.ref }}-secrets-scan
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Run secretlint
        run: npx --yes -p secretlint@13.0.7 -p @secretlint/secretlint-rule-preset-recommend@13.0.7 secretlint --secretlintignore .gitignore "**/*"

  # === SCRIPT CHECKS ===
  # The repository tooling: file size, required docs, Python lint, the script
  # tests and the JavaScript-first rule itself.
  scripts:
    name: Script Checks
    concurrency:
      group: js-${{ github.workflow }}-${{ github.ref }}-scripts
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Check that Rust runs only behind the JavaScript stage
        run: node scripts/check-javascript-first.mjs

      # Warns on pull requests and fails on main until an admin applies
      # .github/main-ruleset.json, so both stages become required checks.
      - name: Check that main requires both CI stages
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RULESET_STRICT: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        run: node scripts/check-branch-ruleset.mjs

      - name: Check file size limit
        run: node scripts/check-file-size.mjs

      - name: Check required documentation
        run: node scripts/check-required-docs.mjs

      # The Python scripts the currency workflow runs (ruff.toml pins the rules).
      - name: Lint Python scripts
        run: |
          pipx run ruff==0.17.0 check .
          pipx run ruff==0.17.0 format --check .

      - name: Run script tests
        run: node --test scripts/*.test.mjs

  # === DEPENDENCY FRESHNESS (NPM) ===
  # The npm half of the freshness check (issue #223) for js/ and web/; the
  # Cargo half runs in rust.yml.
  npm-freshness:
    name: Dependency Freshness (npm)
    concurrency:
      group: js-${{ github.workflow }}-${{ github.ref }}-npm-freshness
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install dependencies
        run: |
          npm ci --prefix js
          npm ci --prefix web

      # Issue #256: freshness is external state, so it blocks pull requests
      # only; on push to main (or schedule/dispatch) it only warns.
      - name: Check dependency freshness
        env:
          GITHUB_EVENT_NAME: ${{ github.event_name }}
        run: node scripts/check-dependency-freshness.mjs --skip-cargo

  # === JAVASCRIPT ENGINE ===
  # The native engine in js/ (issue #254) on the oldest supported Node.js,
  # the current one, and Bun.
  js-lint:
    name: JS Lint and Type Check
    concurrency:
      group: js-${{ github.workflow }}-${{ github.ref }}-js-lint
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: js/package-lock.json

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Check the generated data modules
        run: node scripts/generate-data.mjs --check

  js-test:
    name: JS Test (${{ matrix.runtime }})
    concurrency:
      group: js-${{ github.workflow }}-${{ github.ref }}-js-test-${{ matrix.runtime }}
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        runtime: [node-20, node-24, bun]
    defaults:
      run:
        working-directory: js
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.runtime == 'node-20' && '20.x' || '24.x' }}
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - run: npm ci

      - name: Run tests
        if: matrix.runtime != 'bun'
        run: npm test

      - name: Run tests on Bun
        if: matrix.runtime == 'bun'
        run: bun --bun x vitest run

      # Every input of parity/corpus.json against the Rust goldens.
      - name: Check parity with the Rust goldens
        env:
          RUNTIME: ${{ matrix.runtime == 'bun' && 'bun' || 'node' }}
        run: '"$RUNTIME" scripts/check-parity.mjs'

      - name: Smoke test the package entries
        env:
          RUNTIME: ${{ matrix.runtime == 'bun' && 'bun' || 'node' }}
        run: '"$RUNTIME" scripts/smoke.mjs'

  # === MANUAL CHANGELOG PR ===
  changelog-pr:
    name: Create Changelog PR
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.release_mode == 'changelog-pr'
    concurrency:
      group: js-${{ github.workflow }}-${{ github.ref }}-changelog-pr
      cancel-in-progress: true
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # actions: write dispatches the CI checks for the release PR.
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # create-pull-request authenticates with its own `token` input
          # (git-config-helper.ts configureToken), so no credential persists.
          persist-credentials: false
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Create changelog fragment
        env:
          BUMP_TYPE: ${{ github.event.inputs.bump_type }}
          DESCRIPTION: ${{ github.event.inputs.description }}
        run: node scripts/create-changelog-fragment.mjs --bump-type "$BUMP_TYPE" --description "$DESCRIPTION"

      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: 'chore: add changelog for manual ${{ github.event.inputs.bump_type }} release'
          branch: changelog-manual-release-${{ github.run_id }}
          delete-branch: true
          title: 'chore: manual ${{ github.event.inputs.bump_type }} release'
          body: |
            ## Manual Release Request

            This PR was created by a manual workflow trigger to prepare a **${{ github.event.inputs.bump_type }}** release.

            ### Release Details
            - **Type:** ${{ github.event.inputs.bump_type }}
            - **Description:** ${{ github.event.inputs.description || 'Manual release' }}
            - **Triggered by:** @${{ github.actor }}

            ### Next Steps
            1. Review the changelog fragment in this PR
            2. Merge this PR to main
            3. The automated release workflow will publish to crates.io and create a GitHub release

      # A PR opened with GITHUB_TOKEN gets pull_request runs that wait for a
      # maintainer to approve them, and a merge without approval concludes the
      # zero-job run as failed (PR #255, issue #256). workflow_dispatch runs
      # start right away, and their check runs attach to the PR head commit.
      - name: Run CI checks on the release PR
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          echo "$PR_URL was opened with GITHUB_TOKEN, so its pull_request run waits for approval; dispatching the CI checks on $PR_BRANCH."
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$PR_BRANCH" -f release_mode=checks
          echo "Dispatched: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/release.yml?query=branch%3A$PR_BRANCH"

  # === JAVASCRIPT STAGE ===
  # Terminal status gate of the JavaScript jobs (issue #256's pipeline-status
  # pattern): a job skipped by a failed ancestor, or killed by timeout-minutes
  # (reported as "cancelled"), fails this required check.
  javascript-stage:
    name: JavaScript Stage
    needs:
      - detect-changes
      - changelog
      - version-check
      - secrets-scan
      - npm-freshness
      - scripts
      - js-lint
      - js-test
      - changelog-pr
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check aggregate pipeline status
        env:
          NEEDS_JSON: ${{ toJSON(needs) }}
          # Used to tell a cancelled-but-superseded run (expected churn) from a
          # cancelled run that was still the branch head (a hidden timeout).
          # On pull_request, github.sha is the synthetic merge commit and ref_name
          # is <n>/merge, neither of which a superseding push moves; compare
          # the PR head instead so superseded PR runs are recognised.
          RUN_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BRANCH_REF: ${{ github.head_ref || github.ref_name }}
        run: bash scripts/check-pipeline-status.sh

  # === RUST STAGE ===
  # Starts only when every JavaScript job passed (issue #254). It needs each of
  # them directly, not only the gate: the gate excuses a superseded run's
  # cancelled jobs, and a superseded commit must not build Rust. The group
  # queues per branch and never cancels, so a new push waits for the running
  # Rust stage instead of killing it.
  rust-stage:
    name: Rust Stage
    needs:
      - detect-changes
      - changelog
      - version-check
      - secrets-scan
      - npm-freshness
      - scripts
      - js-lint
      - js-test
      - changelog-pr
      - javascript-stage
    if: |
      !cancelled() &&
      needs.javascript-stage.result == 'success' &&
      !contains(needs.*.result, 'failure') &&
      !contains(needs.*.result, 'cancelled') &&
      inputs.release_mode != 'changelog-pr'
    concurrency:
      group: rust-${{ github.ref }}
      cancel-in-progress: false
    uses: ./.github/workflows/rust.yml
    # The union of what the called jobs escalate to; each job there still
    # declares its own narrower permissions.
    permissions:
      contents: write
      pages: write
      id-token: write
      issues: write
      security-events: write
      actions: read
    secrets:
      CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
      CARGO_TOKEN: ${{ secrets.CARGO_TOKEN }}
    with:
      release_mode: ${{ inputs.release_mode }}
      bump_type: ${{ inputs.bump_type }}
      description: ${{ inputs.description }}
      any_code_changed: ${{ needs.detect-changes.outputs.any-code-changed }}
