name: Coverage Gap Report

on:
  schedule:
    # Every Monday at 06:00 UTC.
    - cron: '0 6 * * 1'
  # Refresh as soon as a merged PR moves the baseline, so the issue does not
  # show last week's numbers (issue #258 showed 13.3% after #235 reached 14.4%).
  push:
    branches: [main]
    paths:
      - docs/case-studies/issue-227/results/coverage-baseline.json
  workflow_dispatch:

concurrency:
  group: coverage-gap-report
  cancel-in-progress: false

# Least-privilege default; the job below escalates to what it needs.
permissions:
  contents: read

env:
  # Provide Git config to actions/checkout itself; checkout runs git init
  # before any workflow step can configure Git.
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -Dwarnings
  CARGO_NET_RETRY: '10'
  CARGO_HTTP_MULTIPLEXING: 'false'

jobs:
  coverage-gap-report:
    name: Refresh Coverage Gap Report
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master branch @ 2026-10-09
        with:
          toolchain: stable

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-build-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-build-

      - name: Build release binary
        run: cargo build --release --locked --bin link-calculator

      # The weekly report measures current gaps; PR/push CI enforces the baseline.
      - name: Regenerate competitor report
        run: node scripts/competitor-coverage.mjs --quiet

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: competitor-coverage-report
          path: docs/case-studies/issue-227/results/coverage-report.md
          retention-days: 14

      # Updates the issue without reopening it: it is a status page, and a
      # weekly reopen made it a perpetual work item for automated solvers
      # (issue #258). Also writes the tables to the job summary, and fails
      # only when gaps remain but no sub-issue of #227 is open to track them.
      - name: Open or update coverage gap issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-coverage-gap-issue.mjs --verbose
