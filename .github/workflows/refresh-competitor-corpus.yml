name: Refresh Competitor Corpus

on:
  schedule:
    # Sunday at 06:00 UTC, ahead of Monday's coverage gap report.
    - cron: '0 6 * * 0'
  workflow_dispatch:

concurrency:
  group: refresh-competitor-corpus
  cancel-in-progress: false

# Least-privilege default; the job below escalates to what it needs.
permissions:
  contents: read

jobs:
  refresh:
    name: Import Upstream Calculator Suites
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      # actions: write dispatches the CI checks for the refresh PR.
      actions: write
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          # create-pull-request authenticates with its own `token` input
          # (git-config-helper.ts configureToken), so no credential persists.
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Fetch current upstream suites
        run: make checkout-corpus CORPUS_CHECKOUTS="$RUNNER_TEMP/calculator-upstreams" CORPUS_LATEST=--latest

      - name: Refresh corpus, revision lock and inventory
        run: make import-corpus CORPUS_CHECKOUTS="$RUNNER_TEMP/calculator-upstreams"

      - name: Verify importer and checkout tests
        run: node --test scripts/import-competitor-corpus.test.mjs scripts/corpus-literals.test.mjs scripts/checkout-competitor-suites.test.mjs

      - name: Prepare changelog when corpus changes
        id: changes
        run: |
          if git diff --quiet -- docs/case-studies/issue-227/corpus/open-source-tests.tsv docs/case-studies/issue-227/competitor-inventory.md scripts/competitor-upstreams.json; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'changed=true' >> "$GITHUB_OUTPUT"
            cat > changelog.d/competitor_corpus_refresh.md <<'FRAGMENT'
          ---
          bump: patch
          ---

          ### Changed
          - Refresh imported open-source calculator assertions and their upstream revision provenance.
          FRAGMENT
          fi

      - name: Open or update refresh PR
        id: cpr
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          # A dedicated token allows the new PR to trigger the normal CI checks.
          token: ${{ secrets.CORPUS_REFRESH_TOKEN || secrets.GITHUB_TOKEN }}
          branch: automation/competitor-corpus
          delete-branch: true
          title: 'chore: refresh upstream calculator test corpus'
          commit-message: 'chore: refresh upstream calculator test corpus'
          body: |
            Refresh all nine suites using their upstream default branches.
            The corpus headers, revision lock and competitor inventory record
            the exact commit SHA, date, original license and source URLs.

            Validation: importer, literal extraction and checkout tests passed.
            Review the corpus diff for changed expectations or retired cases.
            The coverage baseline is preserved so the normal CI coverage gate
            can flag regressions and removals for review.

            Reproduce with `make checkout-corpus` followed by `make import-corpus`.
            See [the refresh guide](https://github.com/link-assistant/calculator/blob/main/docs/competitor-corpus.md).
          add-paths: |
            docs/case-studies/issue-227/corpus/open-source-tests.tsv
            docs/case-studies/issue-227/competitor-inventory.md
            scripts/competitor-upstreams.json
            changelog.d/competitor_corpus_refresh.md

      # A PR opened with GITHUB_TOKEN gets pull_request runs that wait for a
      # maintainer to approve them; workflow_dispatch runs start right away.
      # PR #255's run 38136861895 never started (zero jobs) and was marked
      # failed when the PR merged untested (issue #256). So without
      # CORPUS_REFRESH_TOKEN, dispatch the checks on the PR branch; their
      # check runs attach to the PR head commit.
      # https://docs.github.com/en/actions/how-tos/write-workflows/choose-when-workflows-run/trigger-a-workflow#triggering-a-workflow-from-a-workflow
      - name: Run CI checks on the refresh PR
        if: steps.cpr.outputs.pull-request-operation == 'created' || steps.cpr.outputs.pull-request-operation == 'updated'
        env:
          GH_TOKEN: ${{ github.token }}
          HAS_REFRESH_TOKEN: ${{ secrets.CORPUS_REFRESH_TOKEN != '' }}
          PR_BRANCH: ${{ steps.cpr.outputs.pull-request-branch }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: |
          if [ "$HAS_REFRESH_TOKEN" = 'true' ]; then
            echo "CORPUS_REFRESH_TOKEN opened $PR_URL, so its pull_request run is already queued."
            exit 0
          fi
          echo "::warning title=No CORPUS_REFRESH_TOKEN::$PR_URL was opened with GITHUB_TOKEN, so its pull_request run waits for approval; dispatching the CI checks on $PR_BRANCH instead."
          gh workflow run release.yml --repo "$GITHUB_REPOSITORY" --ref "$PR_BRANCH" -f release_mode=checks
          echo "Dispatched: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/workflows/release.yml?query=branch%3A$PR_BRANCH"
